name: Build Single Extension

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/ja/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew :src:ja:mangatoshokanz:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaToshokanZ-Debug
          path: "src/ja/mangatoshokanz/build/outputs/apk/debug/*.apk"